name: Integration test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  integration_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Start the TSP
        uses: IronCoreLabs/workflows/.github/actions/start-tsp@start-tsp-v2.0.0
        with:
          env-file-path: tests/demo-tsp.conf
          tsp-port: "32804"
      - name: Install hatch
        run: pipx install hatch
      - name: integration test
        run: cargo test --features integration_tests -- --nocapture
