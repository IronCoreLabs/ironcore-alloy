name: Rust CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
  schedule:
    - cron: 0 14 * * 1

jobs:
  rust-ci:
    uses: IronCoreLabs/workflows/.github/workflows/rust-ci.yaml@rust-ci-v2
    with:
      run_clippy: true
      minimum_coverage: "50"
      cargo_command_test_args: "--lib" # Doesn't generate or test Python/Kotlin
    secrets: inherit

  # The examples take ironcore-alloy as a path dependency, so an API change breaks them
  # without anything in the main crate failing to build.
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          cache-provider: github
      - name: Build Rust examples
        run: |
          mapfile -t manifests < <(find examples/rust -mindepth 2 -name Cargo.toml | sort)
          # Guard against a silently-passing job if the examples ever move.
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No example crates found under examples/rust" >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            echo "::group::$manifest"
            cargo build --manifest-path "$manifest"
            echo "::endgroup::"
          done
